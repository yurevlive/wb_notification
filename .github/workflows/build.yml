name: Build Android APK

# Сборка по тегу vX.Y.Z -> APK прикрепляется к релизу (оттуда приложение
# скачивает обновление). Ручной запуск -> просто артефакт, без релиза.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet and Pillow
        run: pip install flet==0.25.2 pillow

      - name: Generate App Icon
        run: |
          mkdir -p assets
          cat << 'EOF' > make_icon.py
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          # Темно-фиолетовый скругленный фон
          d.rounded_rectangle((0, 0, 1024, 1024), radius=230, fill="#1E142B")
          # Неоновое кольцо прицела
          d.ellipse((222, 222, 802, 802), outline="#D946EF", width=36)
          # 4 засечки прицела
          d.rounded_rectangle((494, 150, 530, 240), radius=18, fill="#D946EF")
          d.rounded_rectangle((494, 784, 530, 874), radius=18, fill="#7C3AED")
          d.rounded_rectangle((150, 494, 240, 530), radius=18, fill="#D946EF")
          d.rounded_rectangle((784, 494, 874, 530), radius=18, fill="#7C3AED")
          # Белая стрелка снижения цены по центру
          d.line((512, 350, 512, 650), fill="#FFFFFF", width=52)
          d.line((390, 530, 512, 650), fill="#FFFFFF", width=52)
          d.line((634, 530, 512, 650), fill="#FFFFFF", width=52)
          img.save("assets/icon.png")
          EOF
          python make_icon.py
          rm make_icon.py

      # Ключ подписи один и тот же для всех сборок. Без него Android не даст
      # поставить новую версию поверх старой (разные подписи = конфликт).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "APK will be signed with the project keystore"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK gets a random debug signature and can not update an installed app"
          fi

      # Версия берётся из тега, но сверяется с APP_VERSION в main.py:
      # если они расходятся, приложение будет вечно предлагать обновиться.
      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.${GITHUB_RUN_NUMBER}"; fi
          APP_VER=$(grep -oP '^APP_VERSION = "\K[0-9.]+' main.py || true)
          echo "tag/version: $VER, APP_VERSION: $APP_VER"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VER" != "$APP_VER" ]; then
            echo "::error::App version in main.py ($APP_VER) does not match tag v$VER"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS=(--project "wb-track" --product "WB.Track [by.Жекич]"
                --build-version "$VER" --build-number "$GITHUB_RUN_NUMBER")
          if [ "$SIGNED" = "1" ]; then
            ARGS+=(--android-signing-key-store upload.jks
                   --android-signing-key-store-password "$STORE_PASS"
                   --android-signing-key-alias "${KEY_ALIAS:-upload}"
                   --android-signing-key-password "${KEY_PASS:-$STORE_PASS}")
          fi
          flet build apk "${ARGS[@]}"
          mkdir -p out
          cp build/apk/*.apk "out/wb-track-$VER.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wb-autoorder-apk
          path: out/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: WB.Track ${{ env.VER }}
          body: |
            Сборка ${{ env.VER }}.

            Установка: скачать APK и открыть файл. Android поставит обновление
            поверх старой версии, вход в приложении сохранится.
