name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet and CairoSVG
        run: pip install flet==0.25.2 cairosvg

      - name: Generate App Icon from SVG
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/icon.svg
          <svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://w3.org">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1E142B"/>
                <stop offset="100%" stop-color="#0D0914"/>
              </linearGradient>
              <linearGradient id="neonGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#D946EF"/>
                <stop offset="100%" stop-color="#7C3AED"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
            <circle cx="256" cy="256" r="145" stroke="url(#neonGrad)" stroke-width="18" stroke-dasharray="160 65"/>
            <rect x="247" y="75" width="18" height="45" rx="9" fill="#D946EF"/>
            <rect x="247" y="392" width="18" height="45" rx="9" fill="#7C3AED"/>
            <rect x="75" y="247" width="45" height="18" rx="9" fill="#D946EF"/>
            <rect x="392" y="247" width="45" height="18" rx="9" fill="#7C3AED"/>
            <path d="M256 175V325M256 325L195 265M256 325L317 265" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF
          python -c 'import cairosvg; cairosvg.svg2png(url="assets/icon.svg", write_to="assets/icon.png", output_width=1024, output_height=1024)'
          rm assets/icon.svg

      - name: Build APK
        run: flet build apk --project "WB Снайпер" --product "WB Снайпер"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wb-autoorder-apk
          path: build/apk/*.apk
