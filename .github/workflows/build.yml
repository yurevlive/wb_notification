name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flet
        run: pip install flet
      - name: Build APK
        run: flet build apk --no-enable-impeller --project wb_track --product "WB.Track [by.Жекич]"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wb-autoorder-apk
          path: build/apk/*.apk
