name: WB monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wb-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Check prices and read Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WB_API_BASE: ${{ vars.WB_API_BASE || 'https://yurevlive.pythonanywhere.com' }}
          PUSH_PRICES: "1"
        run: python worker.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "wb-monitor"
            git config user.email "wb-monitor@users.noreply.github.com"
            git add state.json
            git commit -m "chore: monitor state"
            git push
          else
            echo "state unchanged"
          fi
